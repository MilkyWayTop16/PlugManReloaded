# Пользовательские источники обновлений плагинов
#
# Встроенный каталог плагина содержит только официальные и проверенные записи
#
# Записи из этого файла имеют наивысший приоритет над встроенным каталогом
# (Если плагин определяется неверно или вы хотите использовать другой источник,
# то вы можете переопределить его здесь)
#
# После внесения изменений выполните команду: /plm config reload

# Формат добавления плагина
#
# Ключ записи — это имя плагина ровно так, как его показывает /plm list
# (То есть это системное имя из plugin.yml, а не название .jar файла)
#
# Пример структуры:
#
# plugins:
#   <Название плагина>:
#     sources:
#       - id: github
#         ref: "Владелец/Репозиторий"

# Доступные типы источников (айди):
#
#   modrinth — слаг проекта из ссылки modrinth.com/plugin/<Слаг> (Показывает поддерживаемые версии Майнкрафта и устанавливается автоматически)
#
#   hangar — автор/проект с площадки hangar.papermc.io (Показывает поддерживаемые версии Майнкрафта и устанавливается автоматически)
#
#   github — владелец/репозиторий на GitHub (например, "Author/Repo") (Берёт всегда последниерелизы с GitHub)
#
#   spigot — числовой айди ресурса из ссылки spigotmc.org/resources/<Айди> (Только уведомления о новых версиях, так как SpigotMC блокирует прямое скачивание)
#
#   ruspigot — прямая ссылка на ресурс на spigotmc.ru/resources/имя.<Айди> (Если на странице указан репозиторий GitHub, то плагин сможет скачать поагин, но если нету, то не сможет, так как для скачивания нужен вход в аккаунт)
#
#   jenkins — адрес задачи на сборочном сервере (без слэша на конце) (Отдаёт сборки/артефакты, помечаемые как alpha-версии)
#
#   direct — собственный сайт или Rest Api с json-ответом (Поддерживает гибкую настройку json-путей через versionPath и downloadPath)

# Дополнительные параметры записи:
#
#   main — главный класс плагина из plugin.yml (Полезно для форков с тем же именем, предотвращает ошибочное применение к другим плагинам)
#
#   aliases — список альтернативных или старых названий плагина
#
#   url — веб-ссылка на страницу проекта (отображается в чате и подсказках)
#
#   loaders — список поддерживаемых ядер через запятую (например, paper, purpur, folia)
#
#   gameVersions — список поддерживаемых версий игры через запятую (например, 1.20.4, 1.21)

# Безопасность и проверка файлов
#
# (Плагин автоматически скачивает файлы по указанным ссылкам и заменяет рабочий плагин,
# так что всегда указывайте только те репозитории и ссылки, которым вы доверяете)
#

# Список пользовательских источников
plugins: {}

# Примеры настройки (удалите "{}" у "plugins:" выше и используйте нужные примеры):
#
# plugins:
#
#   # Обычный плагин с GitHub
#   МойПлагин:
#     sources:
#       - id: github
#         ref: "MyName/MyPlugin"
#         url: "https://github.com/MyName/MyPlugin"
#
#   # Форк с оригинальным главным классом (защита от ложного срабатывания)
#   VaultSlim:
#     main: "net.milkbowl.vault.Vault"
#     sources:
#       - id: github
#         ref: "Owner/VaultSlim"
#
#   # Сборочный CI сервер Jenkins
#   МойПлагинСCI:
#     sources:
#       - id: jenkins
#         ref: "myplugin"
#         endpoint: "https://ci.example.com/job/MyPlugin"
#         url: "https://example.com/download"
#
#   # Плагин с собственного Api сайта (json-ответ)
#   # (versionPath и downloadPath — путь к полям в JSON через точку)
#   # (loaders и gameVersions — явное указание поддерживаемых платформ и версий игры)
#   МойПлагинССайта:
#     sources:
#       - id: direct
#         ref: "myplugin"
#         endpoint: "https://example.com/api/latest.json"
#         versionPath: "version"
#         downloadPath: "downloads.bukkit"
#         loaders: "paper, purpur, folia"
#         gameVersions: "1.20.4, 1.21"
#         url: "https://example.com/download"
#
#   # Переименованный плагин (старое имя в plugin.yml)
#   AuraSkills:
#     aliases:
#       - "AureliumSkills"
#     sources:
#       - id: modrinth
#         ref: "auraskills"
#
#   # Плагин с площадки SpigotMC.ru
#   nnTNTs:
#     sources:
#       - id: ruspigot
#         ref: "https://spigotmc.ru/resources/nntnts.2206/"
#
#   # Плагин с Modrinth и строгой проверкой главного класса
#   WGExtender:
#     main: "ru.zznty.wgextender.WGExtender"
#     sources:
#       - id: modrinth
#         ref: "wgextender"
