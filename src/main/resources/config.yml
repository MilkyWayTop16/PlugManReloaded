# Версия конфигурации плагина
# (Ни в коем случае не трогать данный параметр!)
config-version: 1.0

# Настройки всех параметров
settings:

  # Язык сообщений и интерфейса плагина
  # Доступные языки:
  #   ru — Русский (файл messages/ru-messages.yml)
  #   en — English (файл messages/en-messages.yml)
  # (Вы также можете создать свой собственный файл сообщений в папке "messages" и указать его здесь)
  language: ru

  # Настройка логирования
  logs-in-console:
    # Включить ли вывод всех подробных логов плагина в консоль? (true/false)
    # (Рекомендуется включать при отладке и мониторинге)
    enable: false
    # Включить ли расширенные диагностические логи отладки? (true/false)
    # (Показывает подробности внутренней очистки памяти, рефлексии и инжекций)
    debug: false

  # Система проверки обновлений плагина
  update-checker:
    # Включить ли автоматическую проверку обновлений? (true/false)
    enabled: true
    # Режим отправки уведомлений об обновлении
    # Доступные варианты:
    #   on-start — уведомлять только при запуске сервера (в консоль и админам)
    #   on-join — уведомлять только при заходе администратора
    #   periodic — уведомлять каждое определённое кол-во часов (в консоль и админам)
    #   both — и при старте, и при заходе, и периодически
    notify-mode: both
    # Интервал периодической проверки только для режимов "periodic" и "both" (в часах)
    periodic-interval-hours: 6

  # Анонимная статистика bStats
  bstats:
    # Включить ли анонимную статистику bStats? (true/false)
    # (bStats автоматически собирает анонимную статистику об использовании плагина на серверах)
    enabled: true

  # Безопасный режим
  # (Динамически защищает системные сервисы, провайдеры API, хуки Netty и зависимые плагины)
  safe-mode:
    # Включить ли безопасный режим? (true/false)
    #   true — показывать интерактивное сообщение с выбором режима при наличии рисков
    #   false — выполнять сразу в один клик без показа сообщения-подтверждения
    enabled: true

  # Перезагрузка связанных зависимостей
  cascade-reload:
    # Использовать ли перезагрузку с зависимостями по умолчанию при команде /plm reload <плагин>? (true/false)
    #   true — автоматически перезагружать все зависимые плагины без указания флага "-c"
    #   false — показывать интерактивное меню выбора или перезагружать только плагин
    by-default: false

  # Автоматическая синхронизация дерева команд клиентов
  # (Мгновенно обновляет подсказки и автокомплит команд в чате у игроков при загрузке/выгрузке)
  auto-sync-commands:
    # Включить ли автоматическую синхронизацию команд? (true/false)
    enabled: true

  # Перехват стандартных команд /plugins и /pl
  # (При включении PlugManReloaded будет выводить свой красивый список плагинов вместо стандартного)
  override-plugins-command:
    # Включить ли перехват команд /plugins и /pl? (true/false)
    enabled: true

  # Использование имен .jar-файлов в подсказках команд
  # (Позволяет выбирать конкретные файлы при наличии дубликатов версий в папке с плагинами)
  use-jar-file-names:
    # Включить ли отображение имен .jar-файлов в таб комплите? (true/false)
    #   true — в подсказках предлагаются только имена .jar-файлов (например, EssentialsX-2.22.0.jar)
    #   false — в подсказках предлагаются стандартные названия плагинов (например, Essentials)
    enabled: true

  # Автоматическая горячая перезагрузка
  # (Отслеживает изменения .jar-файлов в папке с плагинами и мгновенно перезагружает их на лету)
  hot-swap:
    # Включить ли автоматический Hot-Swap по умолчанию при старте сервера? (true/false)
    # (Вы также можете включить или отключить режим в игре командой /plm hotswap on/off)
    enabled: false
    # Задержка перед перезагрузкой (в миллисекундах)
    # (Необходима сборщикам Maven / Gradle для завершения записи файла на диск перед чтением)
    debounce-ms: 500
    # Автоматически загружать новые плагины, если их .jar-файл появился в папке, но самого плагина еще нет на сервере? (true/false)
    # (Рекомендуется false для защиты от несанкционированной загрузки вредоносных файлов, попавших на диск)
    allow-untrusted-loads: false
    # Автоматически выгружать плагин из памяти при удалении его .jar-файла с диска? (true/false)
    auto-unload-on-delete: true
    # Автоматически переименовывать старую версию в .jar.old при установке новой версии? (true/false)
    # (Защищает сервер от конфликтов одинаковых плагинов при следующем перезапуске)
    backup-old-version: true
    # Перезагружать ли зависимые плагины при горячем обновлении? (true/false)
    cascade-reload: true

  # Список плагинов, защищённых от случайной выгрузки, перезагрузки и других действий
  # (Плагины из этого списка невозможно случайно отключить или выгрузить командами)
  ignored-plugins:
    - "PlugManReloaded"

  # Список плагинов, которые технически не выгружаются корректно
  #
  # (Эти плагины встраиваются в сетевой стек сервера или патчат его внутренности при запуске.
  # После выгрузки их состояние восстановить нельзя, будет нужен перезапуск сервера)
  #
  # (При "safe-mode: true "такие плагины требуют подтверждения или флага "-f".
  # Дополнительно плагин сам находит такие библиотеки по классам-маркерам,
  # даже если их переименовали или это форк)
  unsafe-to-unload:
    - "ProtocolLib"
    - "ViaVersion"
    - "ViaBackwards"
    - "PacketEvents"

  # Обновление установленных плагинов
  updates:
    # Проверять ли обновления установленных плагинов при старте сервера? (true/false)
    check-on-start: true
    # Режим отправки уведомлений о найденных обновлениях плагинов
    # Доступные варианты:
    #   on-start — уведомлять только при запуске сервера
    #   on-join — уведомлять только при заходе администратора
    #   both — уведомлять и при запуске, и при заходе администратора
    #   disabled — отключить автоматические уведомления
    notify-mode: both
    # Куда отправлять уведомления о доступных обновлениях плагинов
    # Доступные варианты:
    #   all — отправлять и в консоль, и админам с пермишеном "plugmanreloaded.admin"
    #   players — отправлять только админам в чат
    #   console — отправлять только в консоль сервера
    notify-target: all
    # Разрешить предлагать alpha и beta версии плагинов, если есть? (true/false)
    # (Такие версии всегда требуют отдельного подтверждения)
    allow-prerelease: false
    # Искать ли ссылку на страницу плагина внутри его же .jar-файла? (true/false)
    #
    # (Почти у каждого плагина есть свой встроенный чекер обновлений, а уже в нём есть
    # ссылка на GitHub, SpigotMC или Modrinth. Этот плагин читает строковые константы
    # из .class-файлов и достаёт оттуда ссылку на проект)
    #
    # (Запускается только для тех плагинов, которым не помогли ни хеш, ни каталог,
    # и до обычного поиска по названию: ссылка из самого файла надёжнее догадки
    # поисковика. Сам результат кэшируется по размеру и дате файла, поэтому
    # повторные проверки бесплатны)
    #
    # (Найденный адрес никогда не используется для скачивания напрямую — он лишь
    # подсказывает, что искать на уже известных площадках, и обязан пройти проверку)
    scan-jar-references: true
    # Токен для GitHub API
    #
    # Зачем он нужен?
    #
    #   Без токена сам GitHub разрешает всего 60 запросов в час на один Айпи-Адрес сервера.
    #   При частой проверке обновлений или массовом поиске этот лимит может быстро закончиться.
    #   А вот с указанным токеном лимит расширяется до 5000 запросов в час, поэтому проверки
    #   и скачивания плагинов с GitHub всегда будут работать почти моментально и без задержек)
    #
    # Как бесплатно получить свой личный токен?
    #
    #   1. Сначала нужно перейти по ссылке: https://github.com/settings/tokens
    #   2. Нажать «Generate new token», после «Generate new token (classic)»
    #   3. В строке «Note» укажите любое имя (Например, PlugManReloaded)
    #   4. В строке «Expiration» выберите срок токена (например: No expiration, что означает бесконечный)
    #   5. Галочки прав можно не выбирать (так как для публичных плагинов доступ открыт)
    #   6. В самом низу нажмите зелёную кнопку «Generate token», скопируйте полученный токен и вставьте сюда
    github-token: ""
    # Сколько часов держать ответы площадок в кэше памяти
    # (Для мгновенного принудительного опроса используйте флаг -r / --refresh)
    cache-ttl-hours: 1
    # Ручное указание источника обновления через чат
    manual-source:
      # Разрешить ли администраторам вводить ссылку прямо в чате, если плагин ничего не нашёл? (true/false)
      enabled: true
      # Сколько секунд плагин ждёт ссылку, прежде чем выйти из режима ввода
      timeout-seconds: 60

  # Настройки скачивания плагинов с площадок
  download:
    # На сколько уровней вглубь разрешать рекурсию при поиске зависимостей зависимостей?
    # (Например, для плагина A нужен плагин B, а для B нужен плагин C и так далее)
    max-dependency-depth: 3
    # Настройки таб комплитов для команды
    suggestions:
      # Показывать ли подсказки популярных плагинов? (true/false)
      enabled: true
      # Скрывать ли из подсказок те плагины, которые уже установлены на сервере? (true/false)
      hide-downloaded: true
      # Список популярных плагинов, предлагаемых в автодополнении
      plugins:
        - "LuckPerms"
        - "Vault"
        - "PlaceholderAPI"
        - "DecentHolograms"
        - "EssentialsX"
        - "WorldGuard"
        - "WorldEdit"
        - "ProtocolLib"
        - "CoreProtect"
        - "ViaVersion"
        - "ViaBackwards"
        - "Chunky"
        - "DeluxeMenus"
        - "Citizens"
        - "Multiverse-Core"
        - "FastAsyncWorldEdit"
        - "Spark"
        - "TAB"
        - "PacketEvents"
        - "SkinsRestorer"

  # Настройки резервного копирования плагинов
  # (Резервные копии .jar-файлов сохраняются в скрытой папке с плагинами в папке "plugmanreloaded-backups")
  backups:
    # Сколько дней хранить резервные копии плагинов? (По умолчанию 1 день)
    # (Файлы бэкапов старше указанного срока удаляются автоматически)
    keep-days: 1
    # Максимальное количество резервных копий для каждого плагина
    max-backups-per-plugin: 3

  # Настройки удаления плагинов (/plm delete)
  delete:
    # Удалять ли папку с конфигурацией и другими .yml-файлами при удалении плагина через команду /plm delete? (true/false)
    delete-data-folder: false