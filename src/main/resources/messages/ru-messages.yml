# Версия файла локализации
# (Ни в коем случае не трогать данный параметр!)
config-version: 1.0

# Разные события
#
# Доступные действия для любого списка:
#
#   [message] <Текст> — Отправляет сообщение игроку
#   [message-console] <Текст> — Отправляет сообщение только в консоль
#   [broadcast] <Текст> — Отправляет объявление всем игрокам на сервере
#   [sound] <Айди звука> [Громкость] [Питч] — Проигрывает звук игроку
#   [title] <Текст>;<Подзаголовок>;<Угасает через>;<Остаётся сколько>;<Пропадает через> — Показывает тайтл игроку
#   [actionbar] <Текст> — Показывает текст в строке действия игроку
#   [console-command] <Команда> — Выполняет команду от имени консоли
#   [player-command] <Команда> — Выполняет команду от имени игрока
#
# (Можно полностью удалить определённый акшон, если вы не хотите, чтобы он срабатывал со всеми его командами)

actions:
  errors:
    details:
      unload-failed: "не удалось выгрузить"
      load-failed: "не удалось загрузить"
      enable-failed: "не удалось включить"
      disable-failed: "не удалось выключить"
      dependency-failed: "не загрузилась зависимость"
      unknown: "неизвестная ошибка"
      self-disabled: "плагин отключил себя при запуске или упал при инициализации"
      self-disabled-on-enable: "плагин отключил себя при запуске или упал в onEnable()"
      empty-load-result: "ядро сервера вернуло пустой результат при загрузке плагина"
      loaded-from-memory: "память сервера"
      file-not-found: "«{file}» не найден в папке с плагинами — укажите имя плагина или имя .jar-файла"
    no-permission:
      - "[message] &#FB8808▶ &fНедостаточно &#FB8808прав на использование &fданной команды!"
      - "[sound] BLOCK_ANVIL_LAND"
    console-not-allowed:
      - "[message] &#FB8808▶ Ошибочка! &fТолько &#FB8808игроки &fмогут использовать эту команду!"
      - "[sound] BLOCK_ANVIL_LAND"
    invalid-plugin:
      - "[message] &#FB8808▶ Стоп! &fУкажите &#FB8808корректное &fназвание плагина!"
      - "[sound] BLOCK_ANVIL_LAND"
    plugin-not-found:
      - "[message] &#FB8808▶ Стоп! &fПлагин &#FB8808«{plugin}» &fне найден среди установленных на сервере!"
      - "[sound] BLOCK_ANVIL_LAND"
    has-dependents:
      - "[message] &#FB8808▶ Стоп! &fОт плагина &#FB8808«{plugin}» &fзависят другие плагины: &#FB8808{dependents}&f — выгрузка отменена, чтобы их не сломать"
      - "[sound] BLOCK_ANVIL_LAND"
    plugin-ignored:
      - "[message] &#FB8808▶ Стоп! &fПлагин &#FB8808«{plugin}» &fнаходится в &#FB8808списке &fзащищённых и &#FB8808не может &fбыть выгружен!"
      - "[sound] BLOCK_ANVIL_LAND"
    critical-protected:
      - "[message] &#FB8808▶ Стоп! &fПлагин &#FB8808«{plugin}» &fявляется &#FB8808защищённым &fядром сервера и &#FB8808не может &fбыть выгружен!"
      - "[sound] BLOCK_ANVIL_LAND"
    self-protected:
      - "[message] &#FB8808▶ Стоп! &fПлагин &#FB8808«{plugin}» &fне может управлять &#FB8808сам &fсобой, так что &#FB8808ничего &fне получиться..."
      - "[sound] BLOCK_ANVIL_LAND"
    already-enabled:
      - "[message] &#FB8808▶ &fПлагин &#FB8808«{plugin}» &fуже включен!"
      - "[sound] BLOCK_ANVIL_LAND"
    already-disabled:
      - "[message] &#FB8808▶ &fПлагин &#FB8808«{plugin}» &fуже выключен!"
      - "[sound] BLOCK_ANVIL_LAND"
    reload-disabled:
      - "[message] &#FB8808▶ Стоп! &fПлагин &#FB8808«{plugin}» &fвыключен, используйте команду &#FB8808/plm enable {plugin} &fдля его включения!"
      - "[sound] BLOCK_ANVIL_LAND"
    confirm-expired:
      - "[message] &#FB8808▶ Ошибочка! &fСрок действия подтверждения &#FB8808истёк &fили оно &#FB8808уже было &fиспользовано!"
      - "[sound] BLOCK_ANVIL_LAND"
    operation-cancelled:
      - "[message] &#FB8808▶ Стоп! &fОперацию над плагином &#FB8808«{plugin}» &fотменил &#FB8808другой плагин &fчерез Api-событие PlugManReloaded..."
      - "[sound] BLOCK_ANVIL_LAND"
    internal-error:
      - "[message] &#FB8808▶ Ошибочка! &fПри выполнении операции произошла &#FB8808внутренняя ошибка&f: {error}"
      - "[sound] BLOCK_ANVIL_LAND"
    timeout:
      - "[message] &#FB8808▶ Ошибочка! &fОперация &#FB8808не завершилась &fза отведённое время и была &#FB8808прервана&f..."
      - "[sound] BLOCK_ANVIL_LAND"
    file-not-found:
      - "[message] &#FB8808▶ Ошибочка! &fФайл плагина &#FB8808«{file}» &fне найден в &#FB8808папке &fс плагинами..."
      - "[sound] BLOCK_ANVIL_LAND"
    unsupported-java:
      - "[message] &#FB8808▶ Ошибочка! &fПлагин &#FB8808«{plugin}» &fтребует &#FB8808Java {required-java}+&f, а сервер работает на &#FB8808Java {current-java}&f..."
      - "[sound] BLOCK_ANVIL_LAND"
    unsupported-api:
      - "[message] &#FB8808▶ Ошибочка! &fПлагин &#FB8808«{plugin}» &fтребует неподдерживаемую версию API &#FB8808{api} &fядра!"
      - "[sound] BLOCK_ANVIL_LAND"
    missing-deps:
      - "[message] &#FB8808▶ Ошибочка! &fДля работы плагина &#FB8808«{plugin}» &fотсутствуют нужные зависимости: &#FB8808{deps}"
      - "[sound] BLOCK_ANVIL_LAND"

    circular-deps:
      - "[message] &#FB8808▶ Ошибочка! &fОбнаружена &#FB8808циклическая &fзависимость между плагином &#FB8808«{plugin}» &fи другими плагинами..."
      - "[sound] BLOCK_ANVIL_LAND"
    invalid-description:
      - "[message] &#FB8808▶ Ошибочка! &fВ файле &#FB8808«{file}» &fповреждён или отсутствует манифест &#FB8808plugin.yml&f..."
      - "[sound] BLOCK_ANVIL_LAND"
    jar-corrupted:
      - "[message] &#FB8808▶ Ошибочка! &fФайл &#FB8808«{file}» &fповреждён или &#FB8808не является &f.jar-плагином...."
      - "[sound] BLOCK_ANVIL_LAND"
    class-not-found:
      - "[message] &#FB8808▶ Ошибочка! &fВ плагине &#FB8808«{plugin}» &fне найден обязательный класс &#FB8808{class}&f..."
      - "[sound] BLOCK_ANVIL_LAND"
    incompatible-core:
      - "[message] &#FB8808▶ Ошибочка! &fПлагин &#FB8808«{plugin}» &fнесовместим с ядром (отсутствует метод/поле &#FB8808{member}&f)"
      - "[sound] BLOCK_ANVIL_LAND"
    incompatible-class-change:
      - "[message] &#FB8808▶ Ошибочка! &fПлагин &#FB8808«{plugin}» &fскомпилирован под &#FB8808несовместимую &fверсию интерфейсов ядра..."
      - "[sound] BLOCK_ANVIL_LAND"
    duplicate-plugin:
      - "[message] &#FB8808▶ Ошибочка! &fПлагин с именем &#FB8808«{plugin}» &fуже &#FB8808загружен &fна сервере!"
      - "[sound] BLOCK_ANVIL_LAND"
    database-locked:
      - "[message] &#FB8808▶ Ошибочка! &fБаза данных плагина &#FB8808«{plugin}» &fзаблокирована &#FB8808другим &fпроцессом..."
      - "[sound] BLOCK_ANVIL_LAND"
    port-in-use:
      - "[message] &#FB8808▶ Ошибочка! &fСетевой порт или веб-адрес плагина &#FB8808«{plugin}» &fуже занят!"
      - "[sound] BLOCK_ANVIL_LAND"
    paper-bootstrapper:
      - "[message] &#FB8808▶ Ошибочка! &fПлагин &#FB8808«{plugin}» &fиспользует &#FB8808Paper Bootstrapper &fи &#FB8808не может &fзагружаться на лету..."
      - "[sound] BLOCK_ANVIL_LAND"
    load-failed:
      - "[message] &#FB8808▶ Ошибочка! &fНе удалось &#FB8808загрузить &fплагин &#FB8808«{plugin}» &fиз-за внутренней &#FB8808ошибки &fинициализации..."
      - "[sound] BLOCK_ANVIL_LAND"
    unload-failed:
      - "[message] &#FB8808▶ Ошибочка! &fНе удалось &#FB8808корректно &fвыгрузить плагин &#FB8808«{plugin}» &fиз памяти сервера..."
      - "[sound] BLOCK_ANVIL_LAND"
    delete-failed:
      - "[message] &#FB8808▶ Ошибочка! &fНе удалось &#FB8808удалить &fфайл плагина &#FB8808«{plugin}» &fс диска сервера..."
      - "[sound] BLOCK_ANVIL_LAND"
    reload-failed:
      - "[message] &#FB8808▶ Ошибочка! &fНе удалось &#FB8808перезагрузить &fплагин &#FB8808«{plugin}» &fиз-за внутренней &#FB8808ошибки &fплагина..."
      - "[sound] BLOCK_ANVIL_LAND"
    restart-left-unloaded:
      - "[message] &#FB8808▶ Внимание! &fПлагин &#FB8808«{plugin}» &fбыл &#FB8808корректно &fвыгружен&f, но повторная загрузка того же файла &#FB8808не удалась&f дважды подряд: {error}"
      - "[message] &#FB8808▶ &fПлагин сейчас &#FB8808не работает &fна сервере, так что снова &#FB8808загрузите &fего вручную командой &#FB8808/plm load {plugin} &fпосле устранения ошибки..."
      - "[sound] BLOCK_ANVIL_LAND"
    enable-failed:
      - "[message] &#FB8808▶ Ошибочка! &fПлагин &#FB8808«{plugin}» &fотключил себя или произошла &#FB8808ошибка &fпри включении!"
      - "[sound] BLOCK_ANVIL_LAND"
    disable-failed:
      - "[message] &#FB8808▶ Ошибочка! &fПроизошла непредвиденная &#FB8808ошибка &fпри выключении плагина &#FB8808«{plugin}»&f..."
      - "[sound] BLOCK_ANVIL_LAND"

  help:
    main:
      - "[message] "
      - "[message] &#FFFF00▶ &fСписок доступных команд плагина &#FFFF00PlugManReloaded&f:"
      - "[message] "
      - "[message]   &#FFFF00◆ /plm list (-v/-j) &f— Показать список плагинов сервера (флаг «-v» — с версиями, «-j» — имена JAR)"
      - "[message]   &#FFFF00◆ /plm info <Плагин> &f— Подробная информация о плагине и зависимостях"
      - "[message]   &#FFFF00◆ /plm load <Плагин> &f— Загрузить и включить плагин из папки с плагинами"
      - "[message]   &#FFFF00◆ /plm unload <Плагин> (-f) &f— Корректно выгрузить плагин из памяти сервера"
      - "[message]   &#FFFF00◆ /plm reload <Плагин> (-c/-f) &f— Перезагрузить плагин (флаг «-c» — с зависимостями, «-f» — только этот)"
      - "[message]   &#FFFF00◆ /plm restart <Плагин> (-c/-f) &f— Полностью перезапустить плагин с диска"
      - "[message]   &#FFFF00◆ /plm enable <Плагин> &f— Включить отключенный плагин"
      - "[message]   &#FFFF00◆ /plm disable <Плагин> &f— Отключить работающий плагин"
      - "[message]   &#FFFF00◆ /plm usage <Команда/Пермишен> &f— Найти плагин, зарегистрировавший команду или пермишен"
      - "[message]   &#FFFF00◆ /plm dump &f— Создать файл с полным дампом серверного окружения"
      - "[message]   &#FFFF00◆ /plm update (Плагин/all) (-y/-r/-s) &f— Проверить и установить обновления для плагинов сервера"
      - "[message]   &#FFFF00◆ /plm download <Плагин/URL> (-s/-y) &f— Найти и автоматически скачать плагин с зависимостями"
      - "[message]   &#FFFF00◆ /plm delete <Плагин> (-y/-d) &f— Полностью выгрузить и удалить .jar-файл плагина с диска"
      - "[message]   &#FFFF00◆ /plm hotswap <on/off/status> &f— Авто-слежение за файлами плагинов (авто-загрузка и обновление)"
      - "[message]   &#FFFF00◆ /plm config reload &f— Перезагрузить конфигурацию плагина"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    download:
      - "[message] "
      - "[message]  &#FFFF00▶ &fКоманда: &#FFFF00/plm download <Плагин/Ссылка> (-y/-s/-w)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fОписание: &#FFFF00Позволяет найти или напрямую скачать плагин с Modrinth, Hangar, SpigotMC или GitHub, автоматически подбирая совместимую версию, проверяя и устанавливая недостающие зависимости"
      - "[message] "
      - "[message]  &#FFFF00◆ &fДоступные флаги:"
      - "[message] "
      - "[message]    &#FFFF00-y &fили &#FFFF00--yes &f— Автоматически установить плагин и зависимости без подтверждения"
      - "[message]    &#FFFF00-s &fили &#FFFF00--source <Площадка> &f— Искать плагин только на указанной площадке (например, Modrinth, Hangar, SpigotMC, GitHub и другие)"
      - "[message]    &#FFFF00-w &fили &#FFFF00--with-soft-deps &f— Скачивать также и необязательные зависимости (soft-depend)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fПримеры команд:"
      - "[message] "
      - "[message]    &#FFFF00/plm download LuckPerms &f— Найти плагин по названию"
      - "[message]    &#FFFF00/plm download https://modrinth.com/plugin/luckperms &f— Скачать по прямой ссылке"
      - "[message]    &#FFFF00/plm download DecentHolograms -s modrinth &f— Поиск на конкретной площадке"
      - "[message]    &#FFFF00/plm download WorldGuard -y &f— Скачать с авто-подтверждением зависимостей"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    info:
      - "[message] "
      - "[message]  &#FFFF00▶ &fКоманда: &#FFFF00/plm info <Плагин>"
      - "[message] "
      - "[message]  &#FFFF00◆ &fОписание: &#FFFF00Отображает подробную информацию о плагине: версию, статус, формат, авторов, имя файла на диске, размер, зависимости и интерактивные кнопки управления плагином в чате"
      - "[message] "
      - "[message]  &#FFFF00◆ &fПример команды: &#FFFF00/plm info LuckPerms"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    load:
      - "[message] "
      - "[message]  &#FFFF00▶ &fКоманда: &#FFFF00/plm load <Плагин/-all>"
      - "[message] "
      - "[message]  &#FFFF00◆ &fОписание: &#FFFF00Загружает новый или выгруженный плагин из папки с плагинами в память сервера, выполняет проверку целостности, регистрирует и включает плагин"
      - "[message] "
      - "[message]  &#FFFF00◆ &fДоступный флаг:"
      - "[message] "
      - "[message]    &#FFFF00-all &fили &#FFFF00-a &f— Загрузить сразу все незагруженные плагины из папки с плагинами"
      - "[message] "
      - "[message]  &#FFFF00◆ &fПример команды: &#FFFF00/plm load -all &fили &#FFFF00/plm load EssentialsX"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    unload:
      - "[message] "
      - "[message]  &#FFFF00▶ &fКоманда: &#FFFF00/plm unload <Плагин/-all> (-f)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fОписание: &#FFFF00Безопасно выгружает и выключает плагин из памяти сервера"
      - "[message] "
      - "[message]  &#FFFF00◆ &fДоступные флаги:"
      - "[message] "
      - "[message]    &#FFFF00-all &fили &#FFFF00-a &f— Выгрузить сразу все плагины сервера из памяти"
      - "[message]    &#FFFF00-f &fили &#FFFF00--force &f— Пропустить диалог подтверждения"
      - "[message] "
      - "[message]  &#FFFF00◆ &fПример команды: &#FFFF00/plm unload -all &fили &#FFFF00/plm unload DecentHolograms -f"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    reload:
      - "[message] "
      - "[message]  &#FFFF00▶ &fКоманда: &#FFFF00/plm reload <Плагин/-all> (-c/-f) &fили &#FFFF00/plm reload -c"
      - "[message] "
      - "[message]  &#FFFF00◆ &fОписание: &#FFFF00Перезагружает плагин или перезагружает конфигурацию самого PlugManReloaded"
      - "[message] "
      - "[message]  &#FFFF00◆ &fДоступные флаги:"
      - "[message] "
      - "[message]    &#FFFF00-all &fили &#FFFF00-a &f— Перезагрузить сразу все активные плагины сервера"
      - "[message]    &#FFFF00-c &fили &#FFFF00--cascade &f— Перезагрузить плагин вместе со всеми зависимыми от него"
      - "[message]    &#FFFF00-f &fили &#FFFF00--force &f— Перезагрузить только этот плагин без зависимостей"
      - "[message]    &#FFFF00-c &fили &#FFFF00--config &f— Быстро перезагрузить конфигурацию PlugManReloaded"
      - "[message] "
      - "[message]  &#FFFF00◆ &fПример команды: &#FFFF00/plm reload -all &fили &#FFFF00/plm reload Vault -c"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    restart:
      - "[message] "
      - "[message]  &#FFFF00▶ &fКоманда: &#FFFF00/plm restart <Плагин/-all> (-c/-f)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fОписание: &#FFFF00Выполняет полный перезапуск плагина с повторным считыванием .jar-файла с диска"
      - "[message] "
      - "[message]  &#FFFF00◆ &fДоступные флаги:"
      - "[message] "
      - "[message]    &#FFFF00-all &fили &#FFFF00-a &f— Выполнить полный перезапуск всех плагинов сервера с диска"
      - "[message]    &#FFFF00-c &fили &#FFFF00--cascade &f— Перезапустить плагин вместе со всеми зависимыми от него"
      - "[message]    &#FFFF00-f &fили &#FFFF00--force &f— Перезапустить только этот плагин без зависимостей"
      - "[message] "
      - "[message]  &#FFFF00◆ &fПример команды: &#FFFF00/plm restart -all &fили &#FFFF00/plm restart WorldGuard -c"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    enable:
      - "[message] "
      - "[message]  &#FFFF00▶ &fКоманда: &#FFFF00/plm enable <Плагин/-all>"
      - "[message] "
      - "[message]  &#FFFF00◆ &fОписание: &#FFFF00Включает отключенный плагин без его повторной загрузки с диска"
      - "[message] "
      - "[message]  &#FFFF00◆ &fДоступный флаг:"
      - "[message] "
      - "[message]    &#FFFF00-all &fили &#FFFF00-a &f— Включить сразу все отключенные плагины"
      - "[message] "
      - "[message]  &#FFFF00◆ &fПример команды: &#FFFF00/plm enable -all &fили &#FFFF00/plm enable Chatty"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    disable:
      - "[message] "
      - "[message]  &#FFFF00▶ &fКоманда: &#FFFF00/plm disable <Плагин/-all> (-f)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fОписание: &#FFFF00Отключает работающий плагин без выгрузки его классов из памяти сервера"
      - "[message] "
      - "[message]  &#FFFF00◆ &fДоступные флаги:"
      - "[message] "
