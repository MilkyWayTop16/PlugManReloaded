# Localization file version
config-version: 1.0

# All plugin actions and messages
actions:
  errors:
    details:
      unload-failed: "failed to unload"
      load-failed: "failed to load"
      enable-failed: "failed to enable"
      disable-failed: "failed to disable"
      dependency-failed: "a dependency failed to load"
      unknown: "unknown error"
      self-disabled: "the plugin disabled itself on startup, or an initialization error occurred"
      self-disabled-on-enable: "the plugin disabled itself on startup, or an initialization error occurred in onEnable()"
      empty-load-result: "the server core returned an empty result while loading the plugin"
      loaded-from-memory: "server memory"
      file-not-found: "\"{file}\" was not found in the plugins folder — specify the plugin name or the .jar file name"
    no-permission:
      - "[message] &#FB8808▶ &fNot enough &#FB8808permissions to use &fthis command!"
      - "[sound] BLOCK_ANVIL_LAND"
    console-not-allowed:
      - "[message] &#FB8808▶ Oops! &fOnly &#FB8808players &fcan use this command!"
      - "[sound] BLOCK_ANVIL_LAND"
    invalid-plugin:
      - "[message] &#FB8808▶ Stop! &fSpecify a &#FB8808valid &fplugin name!"
      - "[sound] BLOCK_ANVIL_LAND"
    plugin-not-found:
      - "[message] &#FB8808▶ Stop! &fPlugin &#FB8808«{plugin}» &fisn't installed on the server!"
      - "[sound] BLOCK_ANVIL_LAND"
    has-dependents:
      - "[message] &#FB8808▶ Stop! &fOther plugins depend on &#FB8808«{plugin}»&f: &#FB8808{dependents}&f — unload cancelled to avoid breaking them"
      - "[sound] BLOCK_ANVIL_LAND"
    plugin-ignored:
      - "[message] &#FB8808▶ Stop! &fPlugin &#FB8808«{plugin}» &fis on the &#FB8808protected list &fand &#FB8808cannot &fbe unloaded!"
      - "[sound] BLOCK_ANVIL_LAND"
    critical-protected:
      - "[message] &#FB8808▶ Stop! &fPlugin &#FB8808«{plugin}» &fis &#FB8808protected &fas a critical server plugin and &#FB8808cannot &fbe unloaded!"
      - "[sound] BLOCK_ANVIL_LAND"
    self-protected:
      - "[message] &#FB8808▶ Stop! &fPlugin &#FB8808«{plugin}» &fcan't manage &#FB8808itself&f, so &#FB8808that's &fnot going to work..."
      - "[sound] BLOCK_ANVIL_LAND"
    already-enabled:
      - "[message] &#FB8808▶ &fPlugin &#FB8808«{plugin}» &fis already enabled!"
      - "[sound] BLOCK_ANVIL_LAND"
    already-disabled:
      - "[message] &#FB8808▶ &fPlugin &#FB8808«{plugin}» &fis already disabled!"
      - "[sound] BLOCK_ANVIL_LAND"
    reload-disabled:
      - "[message] &#FB8808▶ Stop! &fPlugin &#FB8808«{plugin}» &fis disabled, use the command &#FB8808/plm enable {plugin} &fto enable it!"
      - "[sound] BLOCK_ANVIL_LAND"
    confirm-expired:
      - "[message] &#FB8808▶ Oops! &fThe confirmation &#FB8808has expired &for &#FB8808has already &fbeen used!"
      - "[sound] BLOCK_ANVIL_LAND"
    operation-cancelled:
      - "[message] &#FB8808▶ Stop! &fThe operation on plugin &#FB8808«{plugin}» &fwas cancelled &#FB8808by another plugin &fthrough a PlugManReloaded API event..."
      - "[sound] BLOCK_ANVIL_LAND"
    internal-error:
      - "[message] &#FB8808▶ Oops! &fAn &#FB8808internal error &foccurred while performing the operation&f: {error}"
      - "[sound] BLOCK_ANVIL_LAND"
    timeout:
      - "[message] &#FB8808▶ Oops! &fThe operation &#FB8808didn't finish &fin time and was &#FB8808aborted&f..."
      - "[sound] BLOCK_ANVIL_LAND"
    file-not-found:
      - "[message] &#FB8808▶ Oops! &fPlugin file &#FB8808«{file}» &fwas not found in the &#FB8808plugins folder&f..."
      - "[sound] BLOCK_ANVIL_LAND"
    unsupported-java:
      - "[message] &#FB8808▶ Oops! &fPlugin &#FB8808«{plugin}» &frequires &#FB8808Java {required-java}+&f, but the server is running &#FB8808Java {current-java}&f..."
      - "[sound] BLOCK_ANVIL_LAND"
    unsupported-api:
      - "[message] &#FB8808▶ Oops! &fPlugin &#FB8808«{plugin}» &frequires an unsupported core API version &#FB8808{api}&f!"
      - "[sound] BLOCK_ANVIL_LAND"
    missing-deps:
      - "[message] &#FB8808▶ Oops! &fPlugin &#FB8808«{plugin}» &fis missing required dependencies: &#FB8808{deps}"
      - "[sound] BLOCK_ANVIL_LAND"

    circular-deps:
      - "[message] &#FB8808▶ Oops! &fA &#FB8808circular &fdependency was found between plugin &#FB8808«{plugin}» &fand other plugins..."
      - "[sound] BLOCK_ANVIL_LAND"
    invalid-description:
      - "[message] &#FB8808▶ Oops! &fFile &#FB8808«{file}» &fhas a corrupted or missing &#FB8808plugin.yml &fmanifest..."
      - "[sound] BLOCK_ANVIL_LAND"
    jar-corrupted:
      - "[message] &#FB8808▶ Oops! &fFile &#FB8808«{file}» &fis corrupted or &#FB8808isn't &fa .jar plugin..."
      - "[sound] BLOCK_ANVIL_LAND"
    class-not-found:
      - "[message] &#FB8808▶ Oops! &fPlugin &#FB8808«{plugin}» &fis missing the required class &#FB8808{class}&f..."
      - "[sound] BLOCK_ANVIL_LAND"
    incompatible-core:
      - "[message] &#FB8808▶ Oops! &fPlugin &#FB8808«{plugin}» &fis incompatible with the core (missing method/field &#FB8808{member}&f)"
      - "[sound] BLOCK_ANVIL_LAND"
    incompatible-class-change:
      - "[message] &#FB8808▶ Oops! &fPlugin &#FB8808«{plugin}» &fwas compiled against an &#FB8808incompatible &fversion of the core interfaces..."
      - "[sound] BLOCK_ANVIL_LAND"
    duplicate-plugin:
      - "[message] &#FB8808▶ Oops! &fA plugin named &#FB8808«{plugin}» &fis already &#FB8808loaded &fon the server!"
      - "[sound] BLOCK_ANVIL_LAND"
    database-locked:
      - "[message] &#FB8808▶ Oops! &fThe database of plugin &#FB8808«{plugin}» &fis locked by &#FB8808another &fprocess..."
      - "[sound] BLOCK_ANVIL_LAND"
    port-in-use:
      - "[message] &#FB8808▶ Oops! &fThe network port or web address of plugin &#FB8808«{plugin}» &fis already in use!"
      - "[sound] BLOCK_ANVIL_LAND"
    paper-bootstrapper:
      - "[message] &#FB8808▶ Oops! &fPlugin &#FB8808«{plugin}» &fuses &#FB8808Paper Bootstrapper &fand &#FB8808cannot &fbe loaded on the fly..."
      - "[sound] BLOCK_ANVIL_LAND"
    load-failed:
      - "[message] &#FB8808▶ Oops! &fFailed to &#FB8808load &fplugin &#FB8808«{plugin}» &fdue to an internal &#FB8808initialization error&f..."
      - "[sound] BLOCK_ANVIL_LAND"
    unload-failed:
      - "[message] &#FB8808▶ Oops! &fFailed to &#FB8808properly &funload plugin &#FB8808«{plugin}» &ffrom server memory..."
      - "[sound] BLOCK_ANVIL_LAND"
    delete-failed:
      - "[message] &#FB8808▶ Oops! &fFailed to &#FB8808delete &fthe file of plugin &#FB8808«{plugin}» &ffrom the server disk..."
      - "[sound] BLOCK_ANVIL_LAND"
    reload-failed:
      - "[message] &#FB8808▶ Oops! &fFailed to &#FB8808reload &fplugin &#FB8808«{plugin}» &fdue to an internal plugin &#FB8808error&f..."
      - "[sound] BLOCK_ANVIL_LAND"
    restart-left-unloaded:
      - "[message] &#FB8808▶ Attention! &fPlugin &#FB8808«{plugin}» &fwas &#FB8808properly &funloaded&f, but reloading the same file &#FB8808failed&f twice in a row: {error}"
      - "[message] &#FB8808▶ &fThe plugin is currently &#FB8808not running &fon the server, so &#FB8808load &fit manually with the command &#FB8808/plm load {plugin} &fonce you've fixed the error..."
      - "[sound] BLOCK_ANVIL_LAND"
    enable-failed:
      - "[message] &#FB8808▶ Oops! &fPlugin &#FB8808«{plugin}» &fdisabled itself or an &#FB8808error &foccurred while enabling it!"
      - "[sound] BLOCK_ANVIL_LAND"
    disable-failed:
      - "[message] &#FB8808▶ Oops! &fAn unexpected &#FB8808error &foccurred while disabling plugin &#FB8808«{plugin}»&f..."
      - "[sound] BLOCK_ANVIL_LAND"

  help:
    main:
      - "[message] "
      - "[message] &#FFFF00▶ &fList of available &#FFFF00PlugManReloaded &fcommands:"
      - "[message] "
      - "[message]   &#FFFF00◆ /plm list (-v/-j) &f— Show the server's plugin list (flag «-v» — with versions, «-j» — JAR names)"
      - "[message]   &#FFFF00◆ /plm info <Plugin> &f— Detailed info about a plugin and its dependencies"
      - "[message]   &#FFFF00◆ /plm load <Plugin> &f— Load and enable a plugin from the plugins folder"
      - "[message]   &#FFFF00◆ /plm unload <Plugin> (-f) &f— Properly unload a plugin from server memory"
      - "[message]   &#FFFF00◆ /plm reload <Plugin> (-c/-f) &f— Reload a plugin (flag «-c» — with dependencies, «-f» — this one only)"
      - "[message]   &#FFFF00◆ /plm restart <Plugin> (-c/-f) &f— Fully restart a plugin from disk"
      - "[message]   &#FFFF00◆ /plm enable <Plugin> &f— Enable a disabled plugin"
      - "[message]   &#FFFF00◆ /plm disable <Plugin> &f— Disable a running plugin"
      - "[message]   &#FFFF00◆ /plm usage <Command/Permission> &f— Find the plugin that registered a command or permission"
      - "[message]   &#FFFF00◆ /plm dump &f— Create a file with a full dump of the server environment"
      - "[message]   &#FFFF00◆ /plm update (Plugin/all) (-y/-r/-s) &f— Check for and install updates for server plugins"
      - "[message]   &#FFFF00◆ /plm download <Plugin/URL> (-s/-y) &f— Find and automatically download a plugin with its dependencies"
      - "[message]   &#FFFF00◆ /plm delete <Plugin> (-y/-d) &f— Fully unload and delete a plugin's .jar file from disk"
      - "[message]   &#FFFF00◆ /plm hotswap <on/off/status> &f— Auto-watch plugin files (auto-load and auto-update)"
      - "[message]   &#FFFF00◆ /plm config reload &f— Reload the plugin's configuration"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    download:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm download <Plugin/Link> (-y/-s/-w)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Finds or directly downloads a plugin from Modrinth, Hangar, SpigotMC or GitHub, automatically picking a compatible version, checking and installing missing dependencies"
      - "[message] "
      - "[message]  &#FFFF00◆ &fAvailable flags:"
      - "[message] "
      - "[message]    &#FFFF00-y &for &#FFFF00--yes &f— Automatically install the plugin and its dependencies without confirmation"
      - "[message]    &#FFFF00-s &for &#FFFF00--source <Site> &f— Search for the plugin only on the specified site (for example, Modrinth, Hangar, SpigotMC, GitHub and others)"
      - "[message]    &#FFFF00-w &for &#FFFF00--with-soft-deps &f— Also download optional dependencies (soft-depend)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand examples:"
      - "[message] "
      - "[message]    &#FFFF00/plm download LuckPerms &f— Find a plugin by name"
      - "[message]    &#FFFF00/plm download https://modrinth.com/plugin/luckperms &f— Download from a direct link"
      - "[message]    &#FFFF00/plm download DecentHolograms -s modrinth &f— Search on a specific site"
      - "[message]    &#FFFF00/plm download WorldGuard -y &f— Download with dependencies auto-confirmed"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    info:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm info <Plugin>"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Shows detailed info about a plugin: version, status, format, authors, file name on disk, size, dependencies and interactive management buttons in chat"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand example: &#FFFF00/plm info LuckPerms"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    load:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm load <Plugin/-all>"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Loads a new or previously unloaded plugin from the plugins folder into server memory, runs an integrity check, registers and enables the plugin"
      - "[message] "
      - "[message]  &#FFFF00◆ &fAvailable flag:"
      - "[message] "
      - "[message]    &#FFFF00-all &for &#FFFF00-a &f— Load all unloaded plugins from the plugins folder at once"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand example: &#FFFF00/plm load -all &for &#FFFF00/plm load EssentialsX"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    unload:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm unload <Plugin/-all> (-f)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Safely unloads and disables a plugin from server memory"
      - "[message] "
      - "[message]  &#FFFF00◆ &fAvailable flags:"
      - "[message] "
      - "[message]    &#FFFF00-all &for &#FFFF00-a &f— Unload all server plugins from memory at once"
      - "[message]    &#FFFF00-f &for &#FFFF00--force &f— Skip the confirmation dialog"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand example: &#FFFF00/plm unload -all &for &#FFFF00/plm unload DecentHolograms -f"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    reload:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm reload <Plugin/-all> (-c/-f) &for &#FFFF00/plm reload -c"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Reloads a plugin, or reloads PlugManReloaded's own configuration"
      - "[message] "
      - "[message]  &#FFFF00◆ &fAvailable flags:"
      - "[message] "
      - "[message]    &#FFFF00-all &for &#FFFF00-a &f— Reload all active server plugins at once"
      - "[message]    &#FFFF00-c &for &#FFFF00--cascade &f— Reload the plugin together with everything that depends on it"
      - "[message]    &#FFFF00-f &for &#FFFF00--force &f— Reload only this plugin without its dependents"
      - "[message]    &#FFFF00-c &for &#FFFF00--config &f— Quickly reload PlugManReloaded's own configuration"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand example: &#FFFF00/plm reload -all &for &#FFFF00/plm reload Vault -c"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    restart:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm restart <Plugin/-all> (-c/-f)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Performs a full plugin restart, re-reading the .jar file from disk"
      - "[message] "
      - "[message]  &#FFFF00◆ &fAvailable flags:"
      - "[message] "
      - "[message]    &#FFFF00-all &for &#FFFF00-a &f— Fully restart all server plugins from disk"
      - "[message]    &#FFFF00-c &for &#FFFF00--cascade &f— Restart the plugin together with everything that depends on it"
      - "[message]    &#FFFF00-f &for &#FFFF00--force &f— Restart only this plugin without its dependents"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand example: &#FFFF00/plm restart -all &for &#FFFF00/plm restart WorldGuard -c"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    enable:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm enable <Plugin/-all>"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Enables a disabled plugin without reloading it from disk"
      - "[message] "
      - "[message]  &#FFFF00◆ &fAvailable flag:"
      - "[message] "
      - "[message]    &#FFFF00-all &for &#FFFF00-a &f— Enable all disabled plugins at once"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand example: &#FFFF00/plm enable -all &for &#FFFF00/plm enable Chatty"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    disable:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm disable <Plugin/-all> (-f)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Disables a running plugin without unloading its classes from server memory"
      - "[message] "
      - "[message]  &#FFFF00◆ &fAvailable flags:"
      - "[message] "
      - "[message]    &#FFFF00-all &for &#FFFF00-a &f— Disable all running server plugins at once"
      - "[message]    &#FFFF00-f &for &#FFFF00--force &f— Skip the confirmation dialog"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand example: &#FFFF00/plm disable -all &for &#FFFF00/plm disable Chatty -f"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    delete:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm delete <Plugin> (-y/-d)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Fully unloads the plugin from memory and deletes its .jar file from the plugins folder (keeping a backup)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fAvailable flags:"
      - "[message] "
      - "[message]    &#FFFF00-y &for &#FFFF00--yes &f— Confirm the deletion immediately without a confirmation dialog"
      - "[message]    &#FFFF00-d &for &#FFFF00--data &f— Also delete the plugin's data folder and all its .yml files"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand example: &#FFFF00/plm delete ProtocolLib -y -d"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    usage:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm usage <Command/Permission>"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Finds exactly which server plugin registered the given command, including command aliases, or a given permission"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand examples: &#FFFF00/plm usage fly &for &#FFFF00/plm usage cmi.command.fly"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    hotswap:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm hotswap <on/off/status>"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Manages the system that automatically watches for plugin changes in the plugins folder"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand parameters:"
      - "[message] "
      - "[message]    &#FFFF00on &f— Enable auto-loading of new plugins, auto-updating and auto-unloading"
      - "[message]    &#FFFF00off &f— Turn off auto-watching for plugin changes"
      - "[message]    &#FFFF00status &f— Check the current state of plugin auto-watching"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand example: &#FFFF00/plm hotswap on"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    config:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm config reload"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Fully reloads the plugin's config.yml configuration file"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand example: &#FFFF00/plm config reload"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"
    update:
      - "[message] "
      - "[message]  &#FFFF00▶ &fCommand: &#FFFF00/plm update (Plugin/-all) (-y/-r/-s)"
      - "[message] "
      - "[message]  &#FFFF00◆ &fDescription: &#FFFF00Checks for newer plugin versions on Modrinth, Hangar, GitHub, SpigotMC, Jenkins and SpigotMC.ru, with an option to install them automatically"
      - "[message] "
      - "[message]  &#FFFF00◆ &fAvailable flags:"
      - "[message] "
      - "[message]    &#FFFF00-all &for &#FFFF00-a &f— Check updates for all installed plugins at once"
      - "[message]    &#FFFF00-y &for &#FFFF00--yes &f— Automatically download and install found updates without confirmation"
      - "[message]    &#FFFF00-r &for &#FFFF00--refresh &f— Clear the version cache and request fresh data from the sites"
      - "[message]    &#FFFF00-s &for &#FFFF00--single &f— Update the plugin without restarting its dependents"
      - "[message] "
      - "[message]  &#FFFF00◆ &fCommand example: &#FFFF00/plm update -all -r"
      - "[message] "
      - "[sound] BLOCK_LEVER_CLICK"

  enable:
    start:
      - "[message] &#FFFF00◆ &fEnabling plugin &#FFFF00«{plugin}»&f..."
      - "[sound] BLOCK_LEVER_CLICK"
    success:
      - "[message] &#FFFF00◆ &fPlugin &#FFFF00«{plugin}» &f(&#FFFF00v{version}&f) &fwas successfully &#FFFF00enabled &fin &#FFFF00{time}ms."
      - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP"
    all-start:
      - "[message] &#FFFF00◆ &fEnabling &#FFFF00all disabled &fplugins on the server..."
      - "[sound] BLOCK_LEVER_CLICK"
    all-partial:
      - "[message] &#FB8808▶ Oops! &fSome plugins (&#FB8808{count}&f/&#FB8808{total}&f) were enabled in &#FFFF00{time}ms&f, but &#FB8808{failed-count} &ffailed: &#FB8808{failed-plugins}"
      - "[sound] ENTITY_VILLAGER_NO"
    all-failed:
      - "[message] &#FB8808▶ Oops! &fNone of the plugins (&#FB88080&f/&#FB8808{total}&f) could be enabled! Check console."
      - "[sound] BLOCK_ANVIL_LAND"
    all-success:
      - "[message] &#FFFF00◆ &fAll previously disabled plugins (&#FFFF00{count}&f/&#FFFF00{total}&f) were successfully &#FFFF00enabled &fin &#FFFF00{time}ms."
      - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP"
    all-empty:
      - "[message] &#FB8808▶ Oops! &fThere are &#FB8808no &fdisabled plugins on the server, all plugins are &#FB8808already &fenabled!"
      - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP"

  disable:
    start:
      - "[message] &#FFFF00◆ &fDisabling plugin &#FFFF00«{plugin}»&f..."
      - "[sound] BLOCK_LEVER_CLICK"
    success:
      - "[message] &#FFFF00◆ &fPlugin &#FFFF00«{plugin}» &f(&#FFFF00v{version}&f) &fwas successfully &#FFFF00disabled &fin &#FFFF00{time}ms."
      - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP"
    all-start:
      - "[message] &#FFFF00◆ &fDisabling &#FFFF00all plugins &fon the server..."
      - "[sound] BLOCK_LEVER_CLICK"
    all-partial:
      - "[message] &#FB8808▶ Oops! &fSome plugins (&#FB8808{count}&f/&#FB8808{total}&f) were disabled in &#FFFF00{time}ms&f, but &#FB8808{failed-count} &ffailed: &#FB8808{failed-plugins}"
      - "[sound] ENTITY_VILLAGER_NO"
    all-failed:
      - "[message] &#FB8808▶ Oops! &fNone of the plugins (&#FB88080&f/&#FB8808{total}&f) could be disabled! Check console."
      - "[sound] BLOCK_ANVIL_LAND"
    all-success:
      - "[message] &#FFFF00◆ &fAll plugins (&#FFFF00{count}&f/&#FFFF00{total}&f) were successfully &#FFFF00disabled &fin &#FFFF00{time}ms."
      - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP"
    all-empty:
      - "[message] &#FB8808▶ Oops! &fThere are &#FB8808no &factive plugins on the server to &#FB8808disable&f..."
      - "[sound] BLOCK_ANVIL_LAND"
    confirm:
      - "[message] "
      - "[message]                   &#FB8808▶ Attention! Be careful!"
