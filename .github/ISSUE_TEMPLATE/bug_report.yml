name: Bug Report
description: Create a report to help us improve PlugManReloaded
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Before submitting, make sure you are running the latest release of PlugManReloaded.

  - type: input
    id: server_version
    attributes:
      label: Server Platform & Version
      description: Run `/version` and paste the full output here.
      placeholder: "e.g. Paper 1.20.4-R0.1-SNAPSHOT (git-Paper-496) or Folia 1.20.4"
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: PlugManReloaded Version
      description: Run `/plm info PlugManReloaded` or check console startup log.
      placeholder: "e.g. 1.1-beta"
    validations:
      required: true

  - type: input
    id: dump_link
    attributes:
      label: Debug Dump (/plm dump)
      description: Run `/plm dump` on your server and paste the generated link here.
      placeholder: "https://..."
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Execute command '/plm ...'
        2. See error...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Stacktrace & Logs
      description: Please paste relevant console logs or errors here.
      render: text
    validations:
      required: false
